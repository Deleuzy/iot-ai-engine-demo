[project]
name = "iot-ai-engine-demo"
version = "0.1.0"
description = "IoT sensor anomaly detection and a model-independent AI engine (RAG, tools, guardrails) on public sensor data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "httpx>=0.27",
]

[project.optional-dependencies]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iot_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B904"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/iot_ai", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
